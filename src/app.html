<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
		/>
		<!-- Own light and dark palette: browsers and extensions should not darken it. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="darkreader-lock" />
		<script>
			const root = document.documentElement;
			let savedTheme;
			try {
				savedTheme = localStorage.getItem('cg-theme');
			} catch {}
			if (savedTheme === 'light' || savedTheme === 'dark') root.dataset.themeChoice = savedTheme;
			root.dataset.theme =
				root.dataset.themeChoice ||
				(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
