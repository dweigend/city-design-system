<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400..600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
		/>
		<!-- Own light and dark palette: browsers and extensions should not darken it. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="darkreader-lock" />
		<script>
			// Set the mode before the first paint, so nothing flashes (owner: catalog/theme/theme.svelte.ts).
			(function () {
				var root = document.documentElement;
				var choice = 'system';
				try {
					var saved = localStorage.getItem('cg-theme');
					if (saved === 'light' || saved === 'dark') choice = saved;
				} catch (e) {}
				var dark =
					choice === 'system'
						? matchMedia('(prefers-color-scheme: dark)').matches
						: choice === 'dark';
				root.dataset.themeChoice = choice;
				root.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
