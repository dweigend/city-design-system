# Quality gate for main. The job name `verify` is the required status check
# in .github/rulesets/main.json. Actions are pinned by commit SHA.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per pushed commit on main, so quick successive merges are each verified.
  group: verify-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (full history for baseline growth checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Resolve baseline base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # HEAD is the PR merge commit; its first parent is the exact main commit it merges into.
            base="$(git rev-parse HEAD^1)"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify --quiet "${base}^{commit}" > /dev/null
          echo "BASELINE_BASE=$base" >> "$GITHUB_ENV"
          echo "baseline base: $base"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:browser
